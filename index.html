<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-gray-100 to-slate-200 min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-indigo-500 selection:text-white">

    <main class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-3xl shadow-xl border border-white/60 p-8 sm:p-10 text-center transition-all duration-300 hover:shadow-2xl">
        
        <div class="relative inline-block mb-6">
            <img 
                src="my.png" 
                alt="프로필 사진" 
                class="w-32 h-32 sm:w-36 sm:h-36 rounded-full object-cover mx-auto shadow-md ring-4 ring-white"
                onerror="this.onerror=null; this.src='https://placehold.co/150x150/6366f1/ffffff?text=Profile';"
            />
        </div>

        <!-- 이름 -->
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight mb-2">
            데일리스케치
        </h1>

        <!-- 한 줄 소개 -->
        <p class="text-indigo-600 font-medium text-sm sm:text-base mb-6">
            소소한 일상을 나누려 합니다
        </p>

        <!-- 3~4줄 짧은 자기소개 -->
        <div class="border-t border-gray-100 pt-6">
            <p class="text-gray-600 text-sm sm:text-base leading-relaxed break-keep">
                AI를 배우며 AI를 활용한 소소한 일상을 남기려 합니다.
            </p>
        </div>

    </main>

</body>
</html>
